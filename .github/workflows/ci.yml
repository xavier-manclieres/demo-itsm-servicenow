name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # bouton « Run workflow » dans l'onglet Actions

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false   # aucune dépendance à mettre en cache
      - name: Tests des nœuds Code
        run: npm test
      - name: Validation des exports de workflows
        run: npm run validate:json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Recherche de secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}